
<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>دردشة ذكاء اصطناعي</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; direction: rtl; }
    #chat { height: 300px; overflow-y: scroll; border: 1px solid #dee2e6; background-color: white; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
    .chat-msg { margin-bottom: 10px; }
    .user { font-weight: bold; color: #0d6efd; }
    .ai { font-weight: bold; color: #198754; }
  </style>
</head>
<body>
  <div class="container py-5">
    <h2 class="text-center mb-4">دردشة الذكاء الاصطناعي</h2>
    <div id="chat" class="mb-3"></div>
    <div class="input-group">
      <input type="text" id="userInput" class="form-control" placeholder="اكتب رسالتك...">
      <button class="btn btn-primary" onclick="sendMessage()">إرسال</button>
    </div>
  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById('userInput');
      const message = input.value.trim();
      if (!message) return;

      const chat = document.getElementById('chat');
      chat.innerHTML += `<div class="chat-msg"><span class="user">أنت:</span> ${message}</div>`;
      input.value = '';

      fetch('chat.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `message=${encodeURIComponent(message)}`
      })
      .then(response => response.json())
      .then(data => {
        chat.innerHTML += `<div class="chat-msg"><span class="ai">الذكاء الاصطناعي:</span> ${data.reply}</div>`;
        chat.scrollTop = chat.scrollHeight;
      });
    }
  </script>
</body>
</html>
