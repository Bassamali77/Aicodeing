
<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>دردشة ذكاء اصطناعي</title>
  <style>
    body { font-family: Arial; direction: rtl; text-align: right; }
    #chat { width: 100%; height: 300px; overflow-y: scroll; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
    input, button { padding: 10px; width: 100%; margin-top: 5px; }
  </style>
</head>
<body>
  <h2>دردشة الذكاء الاصطناعي</h2>
  <div id="chat"></div>
  <input type="text" id="userInput" placeholder="اكتب رسالتك...">
  <button onclick="sendMessage()">إرسال</button>

  <script>
    function sendMessage() {
      const input = document.getElementById('userInput');
      const message = input.value.trim();
      if (!message) return;

      const chat = document.getElementById('chat');
      chat.innerHTML += `<p><strong>أنت:</strong> ${message}</p>`;
      input.value = '';

      fetch('chat.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `message=${encodeURIComponent(message)}`
      })
      .then(response => response.json())
      .then(data => {
        chat.innerHTML += `<p><strong>الذكاء الاصطناعي:</strong> ${data.reply}</p>`;
        chat.scrollTop = chat.scrollHeight;
      });
    }
  </script>
</body>
</html>
