<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>محول العملات</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f0f0f0; direction: rtl; }
    label, select, input, button { display: block; margin: 10px 0; padding: 8px; }
  </style>
</head>
<body>

  <h2>🔁 محول العملات</h2>

  <label>من العملة:</label>
  <select id="fromCurrency">
    <option value="USD">دولار أمريكي (USD)</option>
    <option value="EUR">يورو (EUR)</option>
    <option value="SAR">ريال سعودي (SAR)</option>
    <option value="EGP">جنيه مصري (EGP)</option>
  </select>

  <label>إلى العملة:</label>
  <select id="toCurrency">
    <option value="EUR">يورو (EUR)</option>
    <option value="USD">دولار أمريكي (USD)</option>
    <option value="SAR">ريال سعودي (SAR)</option>
    <option value="EGP">جنيه مصري (EGP)</option>
  </select>

  <label>المبلغ:</label>
  <input type="number" id="amount" value="1">

  <button onclick="convertCurrency()">تحويل</button>

  <h3 id="result"></h3>

  <script>
    async function convertCurrency() {
      const from = document.getElementById('fromCurrency').value;
      const to = document.getElementById('toCurrency').value;
      const amount = document.getElementById('amount').value;

      const response = await fetch(`https://api.exchangerate.host/convert?from=${from}&to=${to}&amount=${amount}`);
      const data = await response.json();

      document.getElementById('result').textContent = `${amount} ${from} = ${data.result.toFixed(2)} ${to}`;
    }
  </script>

</body>
</html>
